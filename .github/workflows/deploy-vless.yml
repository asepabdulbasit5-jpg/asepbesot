# Deploy VLESS pribadi ke Cloudflare — OTOMATIS tiap worker-vless.js di-push
# ke main, plus manual dari tab Actions. Worker name sandekala-vless.
# UUID dibaca dari GitHub Secrets VLESS_UUID (Asep) dan VLESS_UUID_ISTRI (bukan dari file ini).
# Secrets yang dibutuhkan: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, VLESS_UUID, VLESS_UUID_ISTRI.
name: Deploy VLESS Pribadi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - worker-vless.js

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cek sintaks worker
        run: node --check worker-vless.js

      - name: Deploy ke Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VLESS_UUID: ${{ secrets.VLESS_UUID }}
          VLESS_UUID_ISTRI: ${{ secrets.VLESS_UUID_ISTRI }}
        run: |
          cat > wrangler.toml <<EOF
          name = "sandekala-vless"
          main = "worker-vless.js"
          compatibility_date = "2026-11-20"
          [vars]
          UUID = "$VLESS_UUID"
          UUID2 = "$VLESS_UUID_ISTRI"
          EOF
          npx -y wrangler@latest deploy
