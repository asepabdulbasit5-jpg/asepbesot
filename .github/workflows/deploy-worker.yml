# Deploy Worker ke Cloudflare — OTOMATIS tiap file bot di-push ke main,
# plus manual dari tab Actions. Dipakai setelah file
# worker-reseller-bot.js di-update di GitHub. Hanya deploy — tidak
# cek Nadia, tidak ubah file. Cron Trigger auto-cek Nadia ikut
# terpasang lewat wrangler.toml di bawah.
# Secrets yang dibutuhkan: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# ADMIN_CHAT_ID, TELEGRAM_BOT_TOKEN,
# DUITKU_MERCHANT_CODE, DUITKU_API_KEY_SANDBOX
# (repo > Settings > Secrets and variables > Actions).
# PERUBAHAN vs versi lama (26 Nov 2026, integrasi Duitku sandbox):
#  - env deploy: + DUITKU_MERCHANT_CODE, + DUITKU_API_KEY
#    (nilainya diambil dari GitHub Secret DUITKU_API_KEY_SANDBOX).
#  - [vars] wrangler.toml: + DUITKU_MERCHANT_CODE, + DUITKU_SANDBOX="1".
#  - Sebelum deploy: DUITKU_API_KEY di-set sebagai Secret Worker
#    (bukan [vars]) lewat `wrangler secret put` — dijaga
#    `if [ -n ... ]` supaya deploy tetap jalan kalau secret belum ada.
name: Deploy Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - worker-reseller-bot.js

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cek sintaks file bot
        run: node --check worker-reseller-bot.js

      - name: Deploy ke Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          DUITKU_MERCHANT_CODE: ${{ secrets.DUITKU_MERCHANT_CODE }}
          DUITKU_API_KEY: ${{ secrets.DUITKU_API_KEY_SANDBOX }}
        run: |
          cat > wrangler.toml <<EOF
          name = "sandekala"
          main = "worker-reseller-bot.js"
          compatibility_date = "2026-11-20"
          [triggers]
          crons = ["5 * * * *", "* * * * *"]
          [[kv_namespaces]]
          binding = "ORDERS"
          id = "5ed5f1f0bc824dc6b1fd5ac3f9a6e03b"
          [[kv_namespaces]]
          binding = "DATA"
          id = "d570a49feae948b68b7f334a05117efc"
          [vars]
          ADMIN_CHAT_ID = "$ADMIN_CHAT_ID"
          RESELLER_API_URL = "https://www.nadiavpn.web.id/api/v1"
          NADIA_SERVER_ID = "01a1ca6a-b60e-73b9-a2fa-8684c0b25d62"
          NADIA_PROTOCOL = "vless"
          QRIS_IMAGE_URL = "https://raw.githubusercontent.com/asepabdulbasit5-jpg/asepbesot/main/dana.jpg"
          DUITKU_MERCHANT_CODE = "$DUITKU_MERCHANT_CODE"
          DUITKU_SANDBOX = "1"
          EOF
          # API key Duitku WAJIB Secret Worker (bukan [vars]) — jangan
          # tulis nilainya di file ini. Di-set ulang tiap deploy dari
          # GitHub Secret; kalau secret kosong, lewati (fitur Duitku
          # nonaktif, bayar manual tetap jalan).
          if [ -n "$DUITKU_API_KEY" ]; then
            printf '%s' "$DUITKU_API_KEY" | npx -y wrangler@latest secret put DUITKU_API_KEY
          fi
          npx -y wrangler@latest deploy

      - name: Kabari deploy berhasil
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d "chat_id=$ADMIN_CHAT_ID" \
            --data-urlencode "text=✅ Deploy berhasil — bot sudah pakai versi terbaru (auto-cek Nadia aktif)." > /dev/null

      - name: Kabari deploy gagal
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d "chat_id=$ADMIN_CHAT_ID" \
            --data-urlencode "text=❌ Deploy GAGAL — bot masih pakai versi lama. Cek tab Actions buat detail errornya." > /dev/null
