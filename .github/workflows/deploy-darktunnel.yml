# Deploy Dark Tunnel Bot ke Cloudflare — OTOMATIS tiap file bot di-push
# ke main, plus manual dari tab Actions. Dipakai setelah file
# worker-darktunnel-bot.js di-update di GitHub. Hanya deploy — tidak
# cek apa pun, tidak ubah file. Bot ini tanpa KV, tanpa cron, tanpa
# pembayaran. Secret BOT_TOKEN dipasang di dashboard Cloudflare
# (Worker > Settings > Variables), bukan di workflow ini.
# Secrets yang dibutuhkan: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# ADMIN_CHAT_ID, DARKTUNNEL_BOT_TOKEN (token @autosetdark_bot, dipakai
# hanya untuk notifikasi deploy ke admin).
name: Deploy Dark Tunnel Bot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - worker-darktunnel-bot.js

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cek sintaks file bot
        run: node --check worker-darktunnel-bot.js

      - name: Deploy ke Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > wrangler.toml <<EOF
          name = "darktunnel-config"
          main = "worker-darktunnel-bot.js"
          compatibility_date = "2026-11-20"
          [[kv_namespaces]]
          binding = "DATA"
          id = "d570a49feae948b68b7f334a05117efc"
          EOF
          npx -y wrangler@latest deploy

      - name: Kabari deploy berhasil
        if: success()
        env:
          DARKTUNNEL_BOT_TOKEN: ${{ secrets.DARKTUNNEL_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$DARKTUNNEL_BOT_TOKEN/sendMessage" \
            -d "chat_id=$ADMIN_CHAT_ID" \
            --data-urlencode "text=✅ Deploy berhasil — bot Dark Tunnel (@autosetdark_bot) sudah pakai versi terbaru." > /dev/null

      - name: Kabari deploy gagal
        if: failure()
        env:
          DARKTUNNEL_BOT_TOKEN: ${{ secrets.DARKTUNNEL_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$DARKTUNNEL_BOT_TOKEN/sendMessage" \
            -d "chat_id=$ADMIN_CHAT_ID" \
            --data-urlencode "text=❌ Deploy GAGAL — bot Dark Tunnel (@autosetdark_bot) masih pakai versi lama. Cek tab Actions buat detail errornya." > /dev/null
